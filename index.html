<style>
  :root {
    --bg: #1F3D2B;
    --bg-alt: #17301F;
    --bg-rail: #16341F;
    --chalk-line: rgba(245, 242, 234, 0.16);
    --paper: #F7F3E9;
    --paper-alt: #EFE9D8;
    --chalk: #F5F2EA;
    --chalk-soft: rgba(245, 242, 234, 0.62);
    --ink: #2B2118;
    --ink-soft: #6B5D4F;
    --highlighter: #FFD23F;
    --highlighter-ink: #4A3600;
    --correct: #3FA66B;
    --correct-bg: #E4F3EA;
    --incorrect: #D9584C;
    --incorrect-bg: #FAE6E3;
    --accent-blue: #4C7DD9;
    --accent-blue-bg: #E7EEFB;
    --radius: 14px;
    --serif: 'Zilla Slab', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1F3D2B; --paper: #F7F3E9; --ink: #2B2118; }
  }
  :root[data-theme="dark"] { --bg: #16301E; --paper: #F2EDDF; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%; margin: 0; background: var(--bg);
    background-image: linear-gradient(var(--chalk-line) 1px, transparent 1px), linear-gradient(90deg, var(--chalk-line) 1px, transparent 1px);
    background-size: 100% 34px, 34px 100%; background-position: 0 64px, 0 0;
    color: var(--chalk); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .app { max-width: 900px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 48px; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .brand .name { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 5vw, 36px); letter-spacing: 0.01em; position: relative; display: inline-block; }
  .brand .name::after { content: ""; position: absolute; left: 2px; right: 6px; bottom: -5px; height: 6px; background: var(--highlighter); opacity: 0.85; border-radius: 3px; transform: rotate(-0.6deg); }
  .brand .tag { font-size: 13px; color: var(--chalk-soft); }

  .id-chip { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--chalk-soft); }
  .id-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--correct); flex-shrink: 0; }
  .id-chip .dot.off { background: #8a8a8a; }
  .id-chip img { width: 22px; height: 22px; border-radius: 50%; }

  nav.tabs { display: flex; gap: 2px; margin-bottom: -1px; position: relative; z-index: 2; overflow-x: auto; }
  nav.tabs button { background: var(--bg-rail); border: none; color: var(--chalk-soft); font-family: var(--serif); font-size: 15px; font-weight: 600; padding: 11px 18px 13px; border-radius: 10px 10px 0 0; white-space: nowrap; transition: color .15s ease, background .15s ease; }
  nav.tabs button.active { background: var(--paper); color: var(--ink); }
  nav.tabs button:not(.active):hover { color: var(--chalk); }

  .sheet { background: var(--paper); border-radius: 4px var(--radius) var(--radius) var(--radius); color: var(--ink); padding: 28px clamp(18px, 4vw, 38px) 34px 46px; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,0.28); min-height: 360px; }
  .sheet::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px; background: rgba(217, 90, 60, 0.18); }
  .spiral { position: absolute; left: -1px; top: 22px; bottom: 22px; width: 18px; display: flex; flex-direction: column; justify-content: space-between; }
  .spiral i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--paper-alt); margin-left: -7px; }

  h1.section-title { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  p.section-sub { color: var(--ink-soft); margin: 0 0 22px; font-size: 14.5px; max-width: 62ch; }

  .empty { border: 1.5px dashed rgba(43,33,24,0.22); border-radius: 10px; padding: 34px 20px; text-align: center; color: var(--ink-soft); }
  .empty p { margin: 0 0 14px; font-size: 14.5px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 600; transition: transform .12s ease, opacity .12s ease; }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(43,33,24,0.25); }
  .btn.warn { background: var(--incorrect-bg); color: var(--incorrect); }
  .btn.highlight { background: var(--highlighter); color: var(--highlighter-ink); }
  .btn.blue { background: var(--accent-blue); color: #fff; }
  .btn.small { padding: 7px 13px; font-size: 13px; border-radius: 7px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 4px; }
  .item-card { background: var(--paper-alt); border-radius: 10px; padding: 16px 16px 14px; border: 1px solid rgba(43,33,24,0.08); cursor: pointer; transition: box-shadow .15s ease, transform .15s ease; }
  .item-card:hover { box-shadow: 0 6px 16px rgba(43,33,24,0.12); transform: translateY(-2px); }
  .item-card .subject-chip { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--incorrect); background: var(--incorrect-bg); padding: 3px 9px; border-radius: 20px; margin-bottom: 9px; }
  .item-card h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 5px; }
  .item-card .meta { font-size: 12.5px; color: var(--ink-soft); }

  label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 6px; }
  input[type=text], textarea, select { width: 100%; font-family: var(--sans); font-size: 14.5px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid rgba(43,33,24,0.18); background: #fff; color: var(--ink); }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2.5px solid var(--highlighter); outline-offset: 1px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 26, 18, 0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 20px; } }
  .modal { background: var(--paper); color: var(--ink); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .modal { border-radius: 14px; } }
  .modal h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; }
  .modal .close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 20px; color: var(--ink-soft); }
  .modal-inner { position: relative; }

  .flip-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 10px 0 4px; }
  .flip-card { width: 100%; max-width: 420px; height: 240px; perspective: 1200px; }
  .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.22,.9,.32,1); transform-style: preserve-3d; }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: var(--serif); font-size: 19px; line-height: 1.4; box-shadow: 0 8px 22px rgba(43,33,24,0.15); border: 1.5px solid rgba(43,33,24,0.1); }
  .flip-face.front { background: var(--paper-alt); }
  .flip-face.back { background: var(--highlighter); color: var(--highlighter-ink); transform: rotateY(180deg); }
  .flip-hint { font-size: 12.5px; color: var(--ink-soft); }
  .progress-track { width: 100%; max-width: 420px; height: 6px; background: rgba(43,33,24,0.1); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--correct); transition: width .25s ease; }

  .q-option { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--paper-alt); border: 1.5px solid rgba(43,33,24,0.12); border-radius: 9px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 9px; color: var(--ink); }
  .q-option:hover { border-color: rgba(43,33,24,0.3); }
  .q-option .letter { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1.5px solid rgba(43,33,24,0.25); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .q-option.correct { background: var(--correct-bg); border-color: var(--correct); }
  .q-option.correct .letter { background: var(--correct); color: #fff; border-color: var(--correct); }
  .q-option.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect); }
  .q-option.incorrect .letter { background: var(--incorrect); color: #fff; border-color: var(--incorrect); }
  .q-option:disabled { cursor: default; }

  .score-hero { text-align: center; padding: 20px 0 8px; }
  .score-hero .big { font-family: var(--serif); font-size: 52px; font-weight: 700; }
  .score-hero .small { color: var(--ink-soft); font-size: 14px; }

  .lib-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(43,33,24,0.1); }
  .lib-item:last-child { border-bottom: none; }
  .lib-item .ico { width: 34px; height: 34px; border-radius: 8px; background: var(--highlighter); color: var(--highlighter-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 700; }
  .lib-item h4 { margin: 0 0 3px; font-size: 15px; font-family: var(--serif); }
  .lib-item p { margin: 0; font-size: 13.5px; color: var(--ink-soft); word-break: break-word; }
  .lib-item .row { margin-top: 6px; }

  .chip-filter { background: transparent; border: 1.5px solid rgba(43,33,24,0.2); color: var(--ink-soft); border-radius: 20px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; }
  .chip-filter.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .back-link { background: none; border: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 600; padding: 0; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; }
  .back-link:hover { color: var(--ink); }

  footer.note { text-align: center; color: var(--chalk-soft); font-size: 12px; margin-top: 22px; }

  /* Community */
  .post-card { background: var(--paper-alt); border-radius: 10px; padding: 16px 18px; border: 1px solid rgba(43,33,24,0.08); cursor: pointer; margin-bottom: 12px; transition: box-shadow .15s ease, transform .15s ease; }
  .post-card:hover { box-shadow: 0 6px 16px rgba(43,33,24,0.12); transform: translateY(-2px); }
  .post-card h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 6px; }
  .post-card p.preview { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .post-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .avatar { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; background: var(--accent-blue-bg); }
  .avatar.sm { width: 18px; height: 18px; }
  .reply-count { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); margin-left: auto; }

  .reply-item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid rgba(43,33,24,0.08); }
  .reply-item .reply-body { flex: 1; }
  .reply-item .reply-head { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px; }
  .reply-item .reply-head b { color: var(--ink); font-weight: 600; }
  .reply-item p { margin: 0; font-size: 14px; line-height: 1.45; }

  .composer { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; padding-top: 16px; border-top: 1.5px dashed rgba(43,33,24,0.18); }
  .composer textarea { min-height: 46px; }
  .composer .btn { flex-shrink: 0; }

  .banner-note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-blue-bg); color: #2E4A82; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 18px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 8px; }
</style>
</head>

  function timeAgo(ts){
    if (!ts) return "";
    var diff = Math.max(0, Date.now() - ts);
    var m = Math.floor(diff/60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.floor(m/60);
    if (h < 24) return h + "h ago";
    var d = Math.floor(h/24);
    if (d < 7) return d + "d ago";
    return new Date(ts).toLocaleDateString();
  }

  var shuffle = function(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t0 = a[i]; a[i] = a[j]; a[j] = t0; } return a; };
  var buildQuiz = function(cards){
    return cards.map(function(c){
      var others = shuffle(cards.filter(function(x){ return x !== c; }).map(function(x){ return x.back; })).slice(0, 3);
      var opts = shuffle([c.back].concat(others));
      var q = /[?.]$/.test(c.front) ? c.front : "Which best describes: " + c.front + "?";
      return { id: uid(), q: q, options: opts, correct: opts.indexOf(c.back) };
    });
  };
  function seedCurriculum(){
    if (data.curriculumV2) return;
    data.decks = data.decks.filter(function(d){ return !d.builtin && d.name !== "Photosynthesis Basics"; });
    data.quizzes = data.quizzes.filter(function(q){ return !q.builtin && q.title.indexOf("General Knowledge") !== 0; });
    data.resources = data.resources.filter(function(r){ return !r.builtin && r.title !== "Khan Academy" && r.title !== "DepEd Commons"; });
    Object.keys(CURR).forEach(function(subj){
      var units = CURR[subj].map(function(u){ return [u[0], u[1].concat(EXTRA[subj + "|" + u[0]] || [])]; }).concat(NEWUNITS[subj] || []);
      units.forEach(function(u){
        var cards = u[1].map(function(c){ return { id: uid(), front: c[0], back: c[1] }; });
        data.decks.push({ id: uid(), name: subj + " \u00b7 " + u[0], subject: subj, builtin: true, cards: cards });
        data.quizzes.push({ id: uid(), title: u[0] + " Quiz", subject: subj, builtin: true, questions: buildQuiz(cards) });
      });
    });
    RESOURCES.slice().reverse().forEach(function(r){
      data.resources.unshift({ id: uid(), title: r[0], subject: r[1], type: "link", value: r[2], builtin: true });
    });
    data.curriculumV2 = true;
    saveData();
  }

  function onboardingView(){
    var wrap = document.createElement('div');

    card.className = 'sheet';

    var tempRegion = prefs.region || '';

    function paint(){
      card.innerHTML = '';
      var h = document.createElement('h1');
      h.className = 'section-title';
      h.textContent = STRINGS.onboard_title[tempLang] || STRINGS.onboard_title.en;
      var sub = document.createElement('p');
      sub.className = 'section-sub';
      sub.textContent = STRINGS.onboard_sub[tempLang] || STRINGS.onboard_sub.en;
      card.appendChild(h); card.appendChild(sub);

      var langLabel = document.createElement('label');
      langLabel.className = 'field-label';
      langLabel.textContent = STRINGS.onboard_lang[tempLang] || STRINGS.onboard_lang.en;
      var langSelect = document.createElement('select');
      LANGS.forEach(function(l){
        var o = document.createElement('option');
        o.value = l.code; o.textContent = l.label;
        if (l.code === tempLang) o.selected = true;
        langSelect.appendChild(o);
      });
      langSelect.onchange = function(){ tempLang = langSelect.value; paint(); };
      card.appendChild(langLabel); card.appendChild(langSelect);

      var regionLabel = document.createElement('label');
      regionLabel.className = 'field-label';
      regionLabel.textContent = STRINGS.onboard_region[tempLang] || STRINGS.onboard_region.en;
      var regionSelect = document.createElement('select');
      var placeholder = document.createElement('option');
      placeholder.value = ''; placeholder.textContent = '—';
      regionSelect.appendChild(placeholder);
      REGIONS.forEach(function(r){
        var o = document.createElement('option');
        o.value = r; o.textContent = r;
        if (r === tempRegion) o.selected = true;
        regionSelect.appendChild(o);
      });
      regionSelect.onchange = function(){ tempRegion = regionSelect.value; };
      card.appendChild(regionLabel); card.appendChild(regionSelect);

      var go = document.createElement('button');
      go.className = 'btn highlight';
      go.style.marginTop = '20px';
      go.textContent = STRINGS.onboard_continue[tempLang] || STRINGS.onboard_continue.en;
      go.onclick = function(){
        if (!tempRegion) { regionSelect.focus(); return; }
        prefs.region = tempRegion; prefs.lang = tempLang;
        savePrefs();
        render();
      };
      card.appendChild(go);
    }
    paint();
    wrap.appendChild(card);
    return wrap;

    fill.style.width = (((idx+1)/deck.cards.length)*100)+'%';
    track.appendChild(fill);
    stage.appendChild(track);

    var flipCard = document.createElement('div');
    flipCard.className = 'flip-card' + (state.studyFlipped ? ' flipped' : '');
    flipCard.innerHTML =
      '<div class="flip-inner">' +
        '<div class="flip-face front">'+esc(card.front)+'</div>' +
        '<div class="flip-face back">'+esc(card.back)+'</div>' +
      '</div>';
    flipCard.onclick = function(){ state.studyFlipped = !state.studyFlipped; render(); };
    stage.appendChild(flipCard);

    var hint = document.createElement('div');
    hint.className = 'flip-hint';
    hint.textContent = 'Tap to flip · Card ' + (idx+1) + ' of ' + deck.cards.length;
    stage.appendChild(hint);

    var nav = document.createElement('div');
    nav.className = 'row';
    nav.style.marginTop = '6px';
    var prevBtn = document.createElement('button');
    prevBtn.className = 'btn ghost';
    prevBtn.textContent = '← Previous';
    prevBtn.disabled = idx === 0;
    prevBtn.onclick = function(){ state.studyIndex = Math.max(0, idx-1); state.studyFlipped=false; render(); };
    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn highlight';
    nextBtn.textContent = idx === deck.cards.length-1 ? 'Restart from beginning' : 'Next →';
    nextBtn.onclick = function(){
      if (idx === deck.cards.length-1){ state.studyIndex = 0; } else { state.studyIndex = idx+1; }
      state.studyFlipped = false; render();
    };
    nav.appendChild(prevBtn);
    nav.appendChild(nextBtn);
    stage.appendChild(nav);

    wrap.appendChild(stage);
    return wrap;
  }

  function quizTakeView(){
    var quiz = data.quizzes.find(function(q){ return q.id === state.activeId; });
    var wrap = document.createElement('div');
    if (!quiz){ setView('quiz'); return wrap; }

    wrap.appendChild(backLink(t('back_quizzes'), function(){ setView('quiz'); }));

    var title = document.createElement('h1');
    title.className = 'section-title';
    title.textContent = quiz.title;
    wrap.appendChild(title);

    if (state.quizSubmitted){
      var score = state.quizScore;
      var total = quiz.questions.length;
      var pct = Math.round((score/total)*100);
      var hero = document.createElement('div');
      hero.className = 'score-hero';
      hero.innerHTML = '<div class="big">'+score+'/'+total+'</div>' +
        '<div class="small">'+pct+'% correct &mdash; ' + (pct>=80?'Great job! 🎉':(pct>=50?'Good effort, keep going!':'Worth reviewing this topic again.')) + '</div>';
      wrap.appendChild(hero);

      quiz.questions.forEach(function(q, i){
        var block = document.createElement('div');
        block.style.marginTop = '18px';
        var qTitle = document.createElement('p');
        qTitle.style.fontWeight = '600';
        qTitle.style.marginBottom = '8px';
        qTitle.textContent = (i+1)+'. '+q.q;
        block.appendChild(qTitle);
        q.options.forEach(function(opt, oi){
          var picked = state.quizAnswers[q.id];
          var cls = 'q-option';
          if (oi === q.correct) cls += ' correct';
          else if (oi === picked) cls += ' incorrect';
          var o = document.createElement('div');
          o.className = cls;
          o.innerHTML = '<span class="letter">'+String.fromCharCode(65+oi)+'</span><span>'+esc(opt)+'</span>';
          block.appendChild(o);
        });
        wrap.appendChild(block);
      });

      var retry = document.createElement('button');
      retry.className = 'btn highlight';
      retry.style.marginTop = '18px';
      retry.textContent = 'Retake Quiz';
      retry.onclick = function(){ state.quizAnswers = {}; state.quizSubmitted = false; state.quizScore = 0; render(); };
      wrap.appendChild(retry);
      return wrap;
    }

    quiz.questions.forEach(function(q, i){
      var block = document.createElement('div');
      block.style.marginTop = i===0 ? '4px' : '22px';
      var qTitle = document.createElement('p');
      qTitle.style.fontWeight = '600';
      qTitle.style.marginBottom = '8px';
      qTitle.textContent = (i+1)+'. '+q.q;
      block.appendChild(qTitle);
      q.options.forEach(function(opt, oi){
        var picked = state.quizAnswers[q.id];
        var o = document.createElement('button');
        o.className = 'q-option';
        if (picked === oi) { o.style.borderColor = 'var(--highlighter-ink)'; o.style.background = 'var(--highlighter)'; }
        o.innerHTML = '<span class="letter">'+String.fromCharCode(65+oi)+'</span><span>'+esc(opt)+'</span>';
        o.onclick = function(){ state.quizAnswers[q.id] = oi; render(); };
        block.appendChild(o);
      });
      wrap.appendChild(block);
    });

    var allAnswered = quiz.questions.every(function(q){ return state.quizAnswers.hasOwnProperty(q.id); });
    var submit = document.createElement('button');
    submit.className = 'btn highlight';
    submit.style.marginTop = '10px';
    submit.textContent = 'Submit Answers';
    submit.disabled = !allAnswered;
    submit.onclick = function(){
      var score = 0;
      quiz.questions.forEach(function(q){ if (state.quizAnswers[q.id] === q.correct) score++; });
      state.quizScore = score;
      state.quizSubmitted = true;
      render();
    };
    wrap.appendChild(submit);
    return wrap;
  }

    wrap.appendChild(sectionHead(t('comm_title'), t('comm_sub'),
      t('btn_new_post'), function(){
        if (!cloud.available) { alert('Community isn\u2019t available in this view right now.'); return; }

      }));

    if (!cloud.ready){
      wrap.appendChild(loadingNote('Connecting to the community board…'));

      wrap.appendChild(bannerNote('Community discussion isn\u2019t available in this preview. Open the published page inside your organization on claude.ai to post and reply.'));

      wrap.appendChild(loadingNote('Loading discussions…'));

    }

    filterRow.className = 'row';

        '<h3>'+esc(p.title)+'</h3>' +
        '<p class="preview">'+esc(p.body)+'</p>' +
        '<div class="post-meta">' +
          (avatarUrl ? '<img class="avatar" src="'+esc(avatarUrl)+'" alt="">' : '<span class="avatar"></span>') +
          '<span>'+esc(name)+'</span><span>&middot;</span><span>'+timeAgo(p.createdAt)+'</span>' +
        '</div>';
      list.appendChild(card);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function communityPostView(){
    var wrap = document.createElement('div');
    var post = cloud.posts.find(function(p){ return p.id === state.activeId; });

    wrap.appendChild(backLink(t('back_community'), function(){ setView('community'); }));

    if (!post){
      wrap.appendChild(loadingNote('Loading post…'));
      return wrap;
    }

    var authorIds = uniqueAuthorIds([post].concat(cloud.replies));
    resolveProfiles(authorIds);
    var prof = cloud.profileCache[post.authorId];
    var name = (prof && prof.name) || 'Someone';
    var avatarUrl = (prof && prof.avatarUrl) || '';

    var head = document.createElement('div');
    head.innerHTML =
      '<span class="subject-chip">'+esc(post.subject||'General')+'</span>' +
      '<h1 class="section-title" style="margin-top:6px;">'+esc(post.title)+'</h1>' +
      '<div class="post-meta" style="margin-bottom:18px;">' +
        (avatarUrl ? '<img class="avatar" src="'+esc(avatarUrl)+'" alt="">' : '<span class="avatar"></span>') +
        '<span>'+esc(name)+'</span><span>&middot;</span><span>'+timeAgo(post.createdAt)+'</span>' +
      '</div>' +
      '<p style="font-size:15px;line-height:1.55;white-space:pre-wrap;">'+esc(post.body)+'</p>';
    wrap.appendChild(head);

    var repliesWrap = document.createElement('div');
    repliesWrap.style.marginTop = '10px';
    var repliesTitle = document.createElement('p');
    repliesTitle.style.cssText = 'font-weight:600;font-size:13.5px;color:var(--ink-soft);margin-bottom:2px;';
    repliesTitle.textContent = cloud.repliesLoading ? 'Loading replies…' : (cloud.replies.length + ' repl' + (cloud.replies.length===1?'y':'ies'));
    repliesWrap.appendChild(repliesTitle);

    cloud.replies.forEach(function(r){
      var rprof = cloud.profileCache[r.authorId];
      var rname = (rprof && rprof.name) || 'Someone';
      var ravatar = (rprof && rprof.avatarUrl) || '';
      var item = document.createElement('div');
      item.className = 'reply-item';
      item.innerHTML =
        (ravatar ? '<img class="avatar sm" src="'+esc(ravatar)+'" alt="">' : '<span class="avatar sm"></span>') +
        '<div class="reply-body"><div class="reply-head"><b>'+esc(rname)+'</b><span>'+timeAgo(r.createdAt)+'</span></div>' +
        '<p>'+esc(r.body)+'</p></div>';
      repliesWrap.appendChild(item);
    });
    wrap.appendChild(repliesWrap);

    if (cloud.available && cloud.viewerId){
      var composer = document.createElement('div');
      composer.className = 'composer';
      var textarea = document.createElement('textarea');
      textarea.placeholder = 'Write a reply…';
      textarea.rows = 2;
      var sendBtn = document.createElement('button');
      sendBtn.className = 'btn blue';
      sendBtn.textContent = 'Reply';
      sendBtn.onclick = function(){
        var val = textarea.value.trim();
        if (!val) return;
        sendBtn.disabled = true;
        addReply(post.id, val).then(function(){
          textarea.value = '';
          sendBtn.disabled = false;
        }).catch(function(){
          sendBtn.disabled = false;
          alert('Couldn\u2019t send your reply. Please try again.');
        });
      };
      composer.appendChild(textarea);
      composer.appendChild(sendBtn);
      wrap.appendChild(composer);
    } else if (cloud.ready) {
      wrap.appendChild(bannerNote('Sign in within your organization to reply to this post.'));
    }

    return wrap;
  }

  function uniqueAuthorIds(items){
    var seen = {}, out = [];
    items.forEach(function(it){
      if (it.authorId && !seen[it.authorId]){ seen[it.authorId] = true; out.push(it.authorId); }
    });
    return out;
  }

  function resolveProfiles(ids){
    var missing = ids.filter(function(id){ return !cloud.profileCache[id]; });
    if (!missing.length || !cloud.userCap) return;
    cloud.userCap.profiles(ids).then(function(map){
      var changed = false;
      Object.keys(map).forEach(function(id){
        cloud.profileCache[id] = { name: map[id].name, avatarUrl: map[id].avatarUrl };
        changed = true;
      });
      if (changed) render();
    }).catch(function(){});
  }

    var d = document.createElement('div');
    d.className = 'empty';

    return d;

    var d = document.createElement('div');
    d.className = 'banner-note';
    d.innerHTML = '<span>ℹ️</span><span>'+esc(msg)+'</span>';
    return d;
  }

  // ---------- Modals ----------
  function openDeckModal(){ state.modal = { type: 'deck' }; render(); }
  function openCardModal(deckId){ state.modal = { type: 'card', deckId: deckId }; render(); }
  function openQuizModal(){ state.modal = { type: 'quiz', questions: [blankQuestion()] }; render(); }
  function openResourceModal(){ state.modal = { type: 'resource' }; render(); }
  function openPostModal(){ state.modal = { type: 'post' }; render(); }
  function blankQuestion(){ return { q:'', options:['','','',''], correct:0 }; }
  function closeModal(){ state.modal = null; render(); }

  function buildModal(){
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.onclick = function(e){ if (e.target === backdrop) closeModal(); };

    var modal = document.createElement('div');
    modal.className = 'modal';
    var innerWrap = document.createElement('div');
    innerWrap.className = 'modal-inner';

    var closeX = document.createElement('button');
    closeX.className = 'close-x';
    closeX.innerHTML = '&times;';
    closeX.onclick = closeModal;
    innerWrap.appendChild(closeX);

    if (state.modal.type === 'deck') innerWrap.appendChild(deckModalContent());
    if (state.modal.type === 'card') innerWrap.appendChild(cardModalContent());
    if (state.modal.type === 'quiz') innerWrap.appendChild(quizModalContent());
    if (state.modal.type === 'resource') innerWrap.appendChild(resourceModalContent());
    if (state.modal.type === 'post') innerWrap.appendChild(postModalContent());

    modal.appendChild(innerWrap);
    backdrop.appendChild(modal);
    return backdrop;
  }

  function deckModalContent(){
    var w = document.createElement('div');
    w.innerHTML = '<h2>New Deck</h2><p class="section-sub" style="margin-top:2px;">Name your flashcard set.</p>';

    var nameLabel = document.createElement('label');
    nameLabel.className = 'field-label'; nameLabel.textContent = 'Deck Name';
    var nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = 'e.g. English Vocabulary';

    var subjLabel = document.createElement('label');
    subjLabel.className = 'field-label'; subjLabel.textContent = 'Subject';
    var subjInput = document.createElement('input');
    subjInput.type = 'text'; subjInput.placeholder = 'e.g. English, Math, Science';

    w.appendChild(nameLabel); w.appendChild(nameInput);
    w.appendChild(subjLabel); w.appendChild(subjInput);

    var save = document.createElement('button');
    save.className = 'btn highlight';
    save.style.marginTop = '18px';
    save.textContent = 'Create Deck';
    save.onclick = function(){
      if (!nameInput.value.trim()) { nameInput.focus(); return; }
      var deck = { id: uid(), name: nameInput.value.trim(), subject: subjInput.value.trim(), cards: [] };

    };

  function cardModalContent(){
    var w = document.createElement('div');
    w.innerHTML = '<h2>New Card</h2><p class="section-sub" style="margin-top:2px;">Put the question on the front, the answer on the back.</p>';

    var fLabel = document.createElement('label'); fLabel.className='field-label'; fLabel.textContent='Front (Question)';
    var fInput = document.createElement('textarea'); fInput.rows = 2;

    var bLabel = document.createElement('label'); bLabel.className='field-label'; bLabel.textContent='Back (Answer)';
    var bInput = document.createElement('textarea'); bInput.rows = 2;

    w.appendChild(fLabel); w.appendChild(fInput);
    w.appendChild(bLabel); w.appendChild(bInput);

    addAnother.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink-soft);';
    var chk = document.createElement('input');
    chk.type = 'checkbox'; chk.style.width = 'auto'; chk.checked = true;
    addAnother.appendChild(chk);

  function quizModalContent(){
    var w = document.createElement('div');
    w.innerHTML = '<h2>New Quiz</h2><p class="section-sub" style="margin-top:2px;">Build multiple-choice questions.</p>';

    var titleLabel = document.createElement('label'); titleLabel.className='field-label'; titleLabel.textContent='Quiz Title';
    var titleInput = document.createElement('input'); titleInput.type='text'; titleInput.placeholder='e.g. Chapter 3 Review';

    var subjInput = document.createElement('input'); subjInput.type='text'; subjInput.placeholder='e.g. Science';

    w.appendChild(titleLabel); w.appendChild(titleInput);
    w.appendChild(subjLabel); w.appendChild(subjInput);

    var qContainer = document.createElement('div');
    qContainer.style.marginTop = '10px';

    function renderQuestions(){
      qContainer.innerHTML = '';
      state.modal.questions.forEach(function(q, qi){
        var block = document.createElement('div');
        block.style.cssText = 'border-top:1.5px dashed rgba(43,33,24,0.18);padding-top:14px;margin-top:14px;';

        var qLabel = document.createElement('label');
        qLabel.className = 'field-label';
        qLabel.textContent = 'Question ' + (qi+1);
        var qInput = document.createElement('input');
        qInput.type = 'text'; qInput.value = q.q;
        qInput.oninput = function(){ q.q = qInput.value; };
        block.appendChild(qLabel); block.appendChild(qInput);

        q.options.forEach(function(opt, oi){
          var oLabel = document.createElement('label');
          oLabel.className = 'field-label';
          oLabel.style.marginTop = '10px';
          oLabel.textContent = 'Choice ' + String.fromCharCode(65+oi) + (oi===q.correct ? ' (Correct Answer)' : '');
          var oRow = document.createElement('div');
          oRow.className = 'row';
          var oInput = document.createElement('input');
          oInput.type = 'text'; oInput.value = opt; oInput.style.flex = '1';
          oInput.oninput = function(){ q.options[oi] = oInput.value; };
          var mark = document.createElement('button');
          mark.className = 'btn ' + (oi===q.correct ? 'highlight' : 'ghost') + ' small';
          mark.type = 'button';
          mark.textContent = oi===q.correct ? '✓ Correct' : 'Mark correct';
          mark.onclick = function(){ q.correct = oi; renderQuestions(); };
          oRow.appendChild(oInput); oRow.appendChild(mark);
          block.appendChild(oLabel); block.appendChild(oRow);
        });

        if (state.modal.questions.length > 1){
          var rmQ = document.createElement('button');
          rmQ.className = 'btn ghost small';
          rmQ.style.marginTop = '10px';
          rmQ.textContent = 'Remove this question';
          rmQ.onclick = function(){
            state.modal.questions.splice(qi, 1);
            renderQuestions();
          };
          block.appendChild(rmQ);
        }
        qContainer.appendChild(block);
      });
    }
    renderQuestions();
    w.appendChild(qContainer);

    var addQ = document.createElement('button');
    addQ.className = 'btn ghost small';
    addQ.style.marginTop = '14px';
    addQ.textContent = '+ Add Question';
    addQ.onclick = function(){ state.modal.questions.push(blankQuestion()); renderQuestions(); };
    w.appendChild(addQ);

    var save = document.createElement('button');
    save.className = 'btn highlight';
    save.style.cssText = 'margin-top:18px;display:block;width:100%;text-align:center;justify-content:center;';
    save.textContent = 'Save Quiz';
    save.onclick = function(){
      if (!titleInput.value.trim()) { titleInput.focus(); return; }
      var validQuestions = state.modal.questions.filter(function(q){
        return q.q.trim() && q.options.every(function(o){ return o.trim(); });
      }).map(function(q){ return { id: uid(), q: q.q.trim(), options: q.options.map(function(o){return o.trim();}), correct: q.correct }; });
      if (!validQuestions.length) return;
      data.quizzes.push({ id: uid(), title: titleInput.value.trim(), subject: subjInput.value.trim(), questions: validQuestions });
      saveData();
      closeModal();
      setView('quiz');
    };
    w.appendChild(save);
    return w;
  }

  function resourceModalContent(){
    var w = document.createElement('div');
    w.innerHTML = '<h2>New Resource</h2><p class="section-sub" style="margin-top:2px;">Save a link or a short note.</p>';

    var titleLabel = document.createElement('label'); titleLabel.className='field-label'; titleLabel.textContent='Title';
    var titleInput = document.createElement('input'); titleInput.type='text'; titleInput.placeholder='e.g. Algebra Reviewer';

    var subjLabel = document.createElement('label'); subjLabel.className='field-label'; subjLabel.textContent='Subject';
    var subjInput = document.createElement('input'); subjInput.type='text'; subjInput.placeholder='e.g. Math';

    var typeLabel = document.createElement('label'); typeLabel.className='field-label'; typeLabel.textContent='Type';
    var typeSelect = document.createElement('select');
    typeSelect.innerHTML = '<option value="link">Link</option><option value="note">Note</option>';

    var valLabel = document.createElement('label'); valLabel.className='field-label'; valLabel.textContent='URL';
    var valInput = document.createElement('textarea'); valInput.rows = 2; valInput.placeholder='https://...';

    typeSelect.onchange = function(){
      if (typeSelect.value === 'link'){
        valLabel.textContent = 'URL'; valInput.placeholder = 'https://...'; valInput.rows = 1;
      } else {
        valLabel.textContent = 'Note Content'; valInput.placeholder = 'Write your note here...'; valInput.rows = 4;
      }
    };

    w.appendChild(titleLabel); w.appendChild(titleInput);
    w.appendChild(subjLabel); w.appendChild(subjInput);
    w.appendChild(typeLabel); w.appendChild(typeSelect);
    w.appendChild(valLabel); w.appendChild(valInput);

    var save = document.createElement('button');
    save.className = 'btn highlight';
    save.style.marginTop = '16px';
    save.textContent = 'Save';
    save.onclick = function(){
      if (!titleInput.value.trim() || !valInput.value.trim()) return;
      data.resources.push({
        id: uid(), title: titleInput.value.trim(), subject: subjInput.value.trim(),
        type: typeSelect.value, value: valInput.value.trim()
      });
      saveData();
      closeModal();
      setView('library');
    };
    w.appendChild(save);
    return w;
  }

  function postModalContent(){
    var w = document.createElement('div');
    w.innerHTML = '<h2>New Post</h2><p class="section-sub" style="margin-top:2px;">Ask a question or start a discussion for the community.</p>';

    var titleLabel = document.createElement('label'); titleLabel.className='field-label'; titleLabel.textContent='Title';
    var titleInput = document.createElement('input'); titleInput.type='text'; titleInput.placeholder='e.g. Help with quadratic equations?';

    var subjLabel = document.createElement('label'); subjLabel.className='field-label'; subjLabel.textContent='Subject';
    var subjInput = document.createElement('input'); subjInput.type='text'; subjInput.placeholder='e.g. Math';

    var bodyLabel = document.createElement('label'); bodyLabel.className='field-label'; bodyLabel.textContent='Details';
    var bodyInput = document.createElement('textarea'); bodyInput.rows = 4; bodyInput.placeholder='Describe your question or what you want to share…';

    w.appendChild(titleLabel); w.appendChild(titleInput);
    w.appendChild(subjLabel); w.appendChild(subjInput);
    w.appendChild(bodyLabel); w.appendChild(bodyInput);

    var save = document.createElement('button');
    save.className = 'btn highlight';
    save.style.marginTop = '16px';
    save.textContent = 'Post to Community';
    save.onclick = function(){
      if (!titleInput.value.trim() || !bodyInput.value.trim()) return;
      save.disabled = true;
      addPost({
        title: titleInput.value.trim(),
        subject: subjInput.value.trim(),
        body: bodyInput.value.trim()
      }).then(function(){
        closeModal();
        setView('community');
      }).catch(function(){
        save.disabled = false;
        alert('Couldn\u2019t publish your post. Please try again.');
      });
    };
    w.appendChild(save);
    return w;
  }

  // ---------- Cloud (db + user capability) wiring ----------
  function initCloud(){
    if (typeof window.claude === 'undefined' || !window.claude || !window.claude.use){
      cloud.ready = true; cloud.available = false; render();
      return;
    }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(res){
      cloud.dbCap = res[0]; cloud.userCap = res[1];
      cloud.ready = true;
      cloud.available = !!cloud.dbCap;
      if (!cloud.available){ render(); return; }
      var idPromise = cloud.userCap ? cloud.userCap.id() : Promise.resolve(null);
      idPromise.then(function(id){
        cloud.viewerId = id;
        if (id && cloud.userCap) resolveProfiles([id]);
        render();
      }).catch(function(){ render(); });
      subscribePosts();
    }).catch(function(){
      cloud.ready = true; cloud.available = false; render();
    });
  }

  function subscribePosts(){
    if (!cloud.dbCap) return;
    cloud.postsLoading = true;
    var q = cloud.dbCap.collection('posts').orderBy('createdAt', 'desc').limit(50);
    cloud.unsubPosts = q.onSnapshot(function(snap){
      cloud.posts = snap.docs.map(function(d){
        var body = d.data() || {};
        return {
          id: d.id,
          title: body.title || '(untitled)',
          subject: body.subject || '',
          body: body.body || '',
          region: body.region || '',
          authorId: body.authorId || null,
          createdAt: body.createdAt || 0
        };
      });
      cloud.postsLoading = false;
      render();
    }, function(err){
      console.warn('posts subscription error', err);
      cloud.postsLoading = false;
      render();
    });
  }

  function subscribeReplies(postId){
    if (!cloud.dbCap) return;
    unsubscribeReplies();
    cloud.replies = [];
    cloud.repliesLoading = true;
    var q = cloud.dbCap.collection('posts').doc(postId).collection('replies').orderBy('createdAt', 'asc').limit(200);
    cloud.unsubReplies = q.onSnapshot(function(snap){
      cloud.replies = snap.docs.map(function(d){
        var body = d.data() || {};
        return { id: d.id, body: body.body || '', authorId: body.authorId || null, createdAt: body.createdAt || 0 };
      });
      cloud.repliesLoading = false;
      render();
    }, function(err){
      console.warn('replies subscription error', err);
      cloud.repliesLoading = false;
      render();
    });
  }
  function unsubscribeReplies(){
    if (cloud.unsubReplies){ cloud.unsubReplies(); cloud.unsubReplies = null; }
  }

  function addPost(fields){
    if (!cloud.dbCap) return Promise.reject(new Error('no db'));
    return cloud.dbCap.collection('posts').add({
      title: fields.title,
      subject: fields.subject,
      body: fields.body,
      region: prefs.region || '',
      authorId: cloud.viewerId,
      createdAt: Date.now()
    });
  }
  function addReply(postId, body){
    if (!cloud.dbCap) return Promise.reject(new Error('no db'));
    return cloud.dbCap.collection('posts').doc(postId).collection('replies').add({
      body: body,
      authorId: cloud.viewerId,
      createdAt: Date.now()
    });
  }

  // ---------- init ----------
  loadPrefs();
  loadData();
  seedIfEmpty();
  seedCurriculum();
  render();
  initCloud();
})();
</script>
</body>
</html>
